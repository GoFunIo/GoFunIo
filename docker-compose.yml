services:
  postgres:
    image: postgres:16-alpine
    container_name: gofunio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gofunio
      POSTGRES_PASSWORD: gofunio
      POSTGRES_DB: gofunio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gofunio -d gofunio"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gofunio-minio
    command: server /data --console-address ':9001'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: gofunio
      MINIO_ROOT_PASSWORD: gofunio-local-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 gofunio gofunio-local-storage &&
      mc mb --ignore-existing local/gofunio-attachments-local"
    depends_on:
      minio:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: gofunio-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  install:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: gofunio-dev
    command: pnpm install --frozen-lockfile
    environment:
      CI: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules

  migrate:
    image: gofunio-dev
    command: pnpm --filter backend migration:run
    env_file: apps/backend/.env
    environment:
      DATABASE_URL: postgresql://gofunio:gofunio@postgres:5432/gofunio
      MAIL_TRANSPORT: smtp
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  backend:
    image: gofunio-dev
    init: true
    command: pnpm dev:backend
    env_file: apps/backend/.env
    environment:
      DATABASE_URL: postgresql://gofunio:gofunio@postgres:5432/gofunio
      ATTACHMENT_STORAGE_DRIVER: s3
      ATTACHMENT_STORAGE_ENDPOINT: http://minio:9000
      ATTACHMENT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      ATTACHMENT_STORAGE_REGION: us-east-1
      ATTACHMENT_STORAGE_BUCKET: gofunio-attachments-local
      ATTACHMENT_STORAGE_ACCESS_KEY_ID: gofunio
      ATTACHMENT_STORAGE_SECRET_ACCESS_KEY: gofunio-local-storage
      ATTACHMENT_STORAGE_FORCE_PATH_STYLE: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  frontend:
    image: gofunio-dev
    init: true
    command: pnpm --filter frontend dev --host 0.0.0.0
    env_file: apps/frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      install:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  node_modules:
  backend_node_modules:
  frontend_node_modules:
