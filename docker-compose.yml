services:
  postgres:
    image: postgres:16-alpine
    container_name: gofunio-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: gofunio
      POSTGRES_PASSWORD: gofunio
      POSTGRES_DB: gofunio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gofunio -d gofunio']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
