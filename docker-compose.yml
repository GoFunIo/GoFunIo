services:
  postgres:
    image: postgres:16-alpine
    container_name: gofunio-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: gofunio
      POSTGRES_PASSWORD: gofunio
      POSTGRES_DB: gofunio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gofunio -d gofunio']
      interval: 5s
      timeout: 5s
      retries: 5

  install:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: gofunio-dev
    command: pnpm install --frozen-lockfile
    environment:
      CI: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules

  migrate:
    image: gofunio-dev
    command: pnpm --filter backend migration:run
    env_file: apps/backend/.env
    environment:
      DATABASE_URL: postgresql://gofunio:gofunio@postgres:5432/gofunio
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  backend:
    image: gofunio-dev
    init: true
    command: pnpm dev:backend
    env_file: apps/backend/.env
    environment:
      DATABASE_URL: postgresql://gofunio:gofunio@postgres:5432/gofunio
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: gofunio-dev
    init: true
    command: pnpm --filter frontend dev --host 0.0.0.0
    env_file: apps/frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - backend_node_modules:/app/apps/backend/node_modules
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      install:
        condition: service_completed_successfully

volumes:
  postgres_data:
  node_modules:
  backend_node_modules:
  frontend_node_modules:
