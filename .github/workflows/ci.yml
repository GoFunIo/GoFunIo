name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm globally
        run: npm install -g pnpm@8

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint frontend
        run: pnpm --filter frontend lint
        working-directory: .

  build:
    name: Build frontend & backend
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install pnpm globally
        run: npm install -g pnpm@8

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint frontend
        run: pnpm --filter frontend lint
        working-directory: .

      - name: Build frontend
        run: pnpm --filter frontend build
        working-directory: .

      - name: Build backend
        run: pnpm --filter backend build
        working-directory: .