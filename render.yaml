# Render Blueprint — optional. You can also create the Web Service manually in the dashboard.
# Set secret env vars in the Render UI.

services:
  - type: web
    name: gofunio-api-staging
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@10.32.0 && pnpm install --frozen-lockfile && pnpm --filter backend build
    startCommand: node apps/backend/dist/main.js
    healthCheckPath: /status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URL_PATTERNS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
